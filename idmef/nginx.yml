name: nginx
source: https://github.com/IDMEFv2/Concerto-SIEM/blob/3961e482f44e213e6772d4a108e2f4e25dce9491/logstash/rulesets/nginx.yml
ruleset: nginx
rules:
  - id: 5643
    translate:
      - source: "[Attachment][RawLog][Content][service][err_num]"
        target: "[Description]"
        dictionary:
          "404": "Invalid Web page access"
          "403": "Unauthorized Web access"
          "500": "Internal Web server Error"
        fallback: "Unknown error"
    fields:
      "[Source][0][IP]": "%{[Attachment][RawLog][Content][source][address]}"
      "[Target][0][Service]": "nginx"
      "[Target][0][Hostname]": "%{[Attachment][RawLog][Content][host][hostname]}"
      "[Priority]": "Medium"
      "[Category][0]": "Defense.Other"
      "[Description]": "%{[Attachment][RawLog][Content][service][err_num]} error returned to %{[Attachment][RawLog][Content][source][address]}"
