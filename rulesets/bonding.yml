ruleset:
  name: bonding
  field: "[Attachment][RawLog][Content][message]"
  predicate:
    operator: or
    operands:
      - operator: in
        operands:
          - operator: variable
            operands: "[Attachment][RawLog][Content][process][name]"
          - operator: constant
            operands: "kernel"
      - operator: in
        operands:
          - operator: variable
            operands: "[Attachment][RawLog][Content][process][name]"
          - operator: constant
            operands: "ulogd"
  rules:
    - id: 4800
      pattern: "bonding:\\s%{WORD:[Attachment][RawLog][Content][bonding][belong]}:\\s%{WORD:[Attachment][RawLog][Content][bonding][type]}\\sinterface\\s%{WORD:[Attachment][RawLog][Content][bonding[...]}"
      samples:
        - "Aug 24 00:54:18 blah kernel: bonding: bond0: backup interface eth0 is now up"
