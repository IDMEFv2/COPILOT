ruleset:
  name: cacti-thold
  field: "[Attachment][RawLog][Content][message]"
  predicate:
    operator: in
    operands:
      - operator: variable
        operands: "[Attachment][RawLog][Content][message]"
      - operator: constant
        operands: "CactiTholdLog"
  rules:
    - id: 4500
      pattern: "%{NOTSPACE:[Attachment][RawLog][Content][nodeName]} - (?<data>.+) went above threshold of %{INT:[Attachment][RawLog][Content][threshold]} with %{NUMBER:[Attachment][RawLog][Content[...]}"
      samples:
        - "Oct  2 05:26:15 smf-syslog-02 172/172 CactiTholdLog[19647]: smf-core-02 - 5 Minute CPU went above threshold of 85 with 90.8067 at trigger 1 out of 1"
