ruleset:
  name: cisco-router
  field: "[Attachment][RawLog][Content][event][original]"
  predicate:
    operator: in
    operands:
      - operator: variable
        operands: "[Attachment][RawLog][Content][event][code]"
      - operator: constant
        operands: "^[A-Z0-9_]+-\\.+-[A-Z0-9_]$"
  rules:
    - id: 5600
      pattern: "SEC-6-IPACCESSLOGP: list %{DATA:data} denied (udp|tcp) %{IP:[Attachment][RawLog][Content][source][address]}\\.%{INT:number}\\. -> %{IP:[Attachment][RawLog][Content][destination][ad[...]"
      samples:
        - "Sep 23 07:30:41 gate 301270: 5d17h: %SEC-6-IPACCESSLOGP: list 101 denied tcp 1.2.3.4(1929) -> 5.6.7.8(80), 1 packet"
